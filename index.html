<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>TripStore 後台</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23007AFF'/><g fill='%23fff'><rect x='30' y='34' width='40' height='20' rx='8'/><rect x='19' y='45' width='62' height='19' rx='7'/></g><circle cx='34' cy='65' r='6.5' fill='%230A2A5E'/><circle cx='66' cy='65' r='6.5' fill='%230A2A5E'/></svg>">
<style>
/* ─────────────────────────── tokens ─────────────────────────── */
:root{
  /* 淺色語意色一律加深至 AA(白底 ≥4.5:1、灰底 ≥4.5:1);
     Apple 原值 #007AFF/#34C759 在白底只有 4.02/3.07,當文字或按鈕底色都不合格 */
  --bg:#F2F2F7; --surface:#FFF; --surface-2:#F2F2F7; --surface-hover:rgba(0,0,0,.035);
  --label:#000; --label-2:#5D5D63; --label-3:#68686D;
  --separator:rgba(60,60,67,.29);
  /* tinted/danger 按鈕可能落在群組外的灰底上,tint 疊灰底比疊白底更暗 → 取最壞情況仍 ≥4.5 的值 */
  --blue:#0A5FBF; --blue-fill:#0B63C5; --blue-tint:rgba(10,95,191,.12);
  --green:#1B7A38; --red:#B01810; --orange:#9A5B00; --teal:#16707F; --purple:#6B34A8;
  --dot-green:#34C759; --dot-red:#FF3B30; --dot-orange:#FF9500;
  --red-tint:rgba(176,24,16,.12);
  --nav-bg:rgba(242,242,247,.82);
  --shadow:0 1px 3px rgba(0,0,0,.06),0 8px 28px rgba(0,0,0,.08);
  --r-lg:14px; --r-md:10px; --r-sm:8px;
  --ease:cubic-bezier(.32,.72,0,1);
  --z-sheet:50; --z-nav:20;
}
/* 深色:系統偏好 或 使用者手動選 dark。手動選 light 時不套用(:not([data-theme=light])) */
@media (prefers-color-scheme:dark){
  :root:not([data-theme=light]){
    /* 深色:文字色需要「亮」,填色底需要「暗」(白字壓在上面),兩者方向相反 → --blue 與 --blue-fill 分開 */
    --bg:#000; --surface:#1C1C1E; --surface-2:#2C2C2E; --surface-hover:rgba(255,255,255,.06);
    --label:#FFF; --label-2:#A1A1A8; --label-3:#96969E;
    --separator:rgba(84,84,88,.6);
    --blue:#409EFF; --blue-fill:#0C6CD4; --blue-tint:rgba(64,158,255,.12);
    --green:#30D158; --red:#FF6961; --orange:#FF9F0A; --teal:#40C8E0; --purple:#BF5AF2;
    --dot-green:#30D158; --dot-red:#FF453A; --dot-orange:#FF9F0A;
    --red-tint:rgba(255,105,97,.12);
    --nav-bg:rgba(20,20,22,.78);
    --shadow:0 1px 3px rgba(0,0,0,.5),0 12px 40px rgba(0,0,0,.55);
  }
}
:root[data-theme=dark]{
    /* 深色:文字色需要「亮」,填色底需要「暗」(白字壓在上面),兩者方向相反 → --blue 與 --blue-fill 分開 */
    --bg:#000; --surface:#1C1C1E; --surface-2:#2C2C2E; --surface-hover:rgba(255,255,255,.06);
    --label:#FFF; --label-2:#A1A1A8; --label-3:#96969E;
    --separator:rgba(84,84,88,.6);
    --blue:#409EFF; --blue-fill:#0C6CD4; --blue-tint:rgba(64,158,255,.12);
    --green:#30D158; --red:#FF6961; --orange:#FF9F0A; --teal:#40C8E0; --purple:#BF5AF2;
    --dot-green:#30D158; --dot-red:#FF453A; --dot-orange:#FF9F0A;
    --red-tint:rgba(255,105,97,.12);
    --nav-bg:rgba(20,20,22,.78);
    --shadow:0 1px 3px rgba(0,0,0,.5),0 12px 40px rgba(0,0,0,.55);
  }


/* ─────────────────────────── base ─────────────────────────── */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  background-color:var(--bg); color:var(--label); min-height:100vh;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI Variable","Segoe UI","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  font-size:16px; line-height:1.45; letter-spacing:-.01em;
  -webkit-font-smoothing:antialiased;
}
button,input,select{font:inherit;color:inherit;letter-spacing:inherit}
button{background:none;border:0;cursor:pointer}
:focus-visible{outline:2.5px solid var(--blue);outline-offset:2px;border-radius:4px}
.num{font-variant-numeric:tabular-nums}
.hide{display:none!important}

/* ─────────────────────────── shell ─────────────────────────── */
.nav{
  position:sticky;top:0;z-index:var(--z-nav);
  background-color:var(--nav-bg);
  -webkit-backdrop-filter:saturate(180%) blur(20px); backdrop-filter:saturate(180%) blur(20px);
  border-bottom:.5px solid var(--separator);
  padding-top:env(safe-area-inset-top);
}
.nav-in{
  max-width:1080px;margin:0 auto;padding:11px 20px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
}
.brand{display:flex;align-items:center;gap:9px;min-width:0}
.brand svg{width:26px;height:26px;flex:none;border-radius:6px}
.brand-t{font-size:1.0625rem;font-weight:640;letter-spacing:-.022em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-s{font-size:.75rem;color:var(--label-2);font-weight:400;letter-spacing:0}
main{max-width:1080px;margin:0 auto;padding:20px 20px calc(48px + env(safe-area-inset-bottom))}

/* ─────────────────── segmented control ─────────────────── */
.seg{
  position:relative;display:grid;gap:2px;padding:2px;margin-bottom:22px;
  background-color:var(--surface-2);border-radius:9px;
  max-width:440px;  /* 桌機:讀作「控制項」而非滿版工具列 */
}
@media (prefers-color-scheme:light){:root:not([data-theme=dark]) .seg{background-color:rgba(118,118,128,.12)}}
:root[data-theme=light] .seg{background-color:rgba(118,118,128,.12)}
.seg-ind{
  position:absolute;top:2px;bottom:2px;left:2px;border-radius:7px;
  background-color:var(--surface);box-shadow:0 3px 8px rgba(0,0,0,.12),0 3px 1px rgba(0,0,0,.04);
  transition:transform .26s var(--ease),width .26s var(--ease);pointer-events:none;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .seg-ind{background-color:#636366;box-shadow:none}}
:root[data-theme=dark] .seg-ind{background-color:#636366;box-shadow:none}
.seg button{
  position:relative;z-index:1;padding:7px 4px;border-radius:7px;
  font-size:.8125rem;font-weight:590;color:var(--label);
  transition:opacity .2s,color .2s;white-space:nowrap;
  display:flex;align-items:center;justify-content:center;gap:5px;
}
.seg button svg{
  width:16px;height:16px;flex:none;
  fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;
}
.seg button:not(.on){color:var(--label-2);font-weight:500}
.seg button:not(.on) svg{opacity:.75}
.seg button:active{opacity:.5}
@media (max-width:400px){
  .seg button{flex-direction:column;gap:3px;padding:6px 2px;font-size:.6875rem}
  .seg button svg{width:19px;height:19px}
}

/* ─────────────────── 主題切換(淺/深/自動) ─────────────────── */
.theme{
  display:inline-flex;gap:1px;padding:2px;border-radius:8px;
  background-color:var(--surface-2);flex:none;
}
@media (prefers-color-scheme:light){:root:not([data-theme=dark]) .theme{background-color:rgba(118,118,128,.12)}}
:root[data-theme=light] .theme{background-color:rgba(118,118,128,.12)}
.theme button{
  width:30px;height:26px;border-radius:6px;display:grid;place-items:center;
  color:var(--label-2);transition:background-color .18s,color .18s;position:relative;
}
/* 視覺維持精巧,觸控區擴到 44pt */
.theme button::after{content:"";position:absolute;left:50%;top:50%;width:44px;height:44px;transform:translate(-50%,-50%)}
.theme button svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.theme button.on{background-color:var(--surface);color:var(--label);box-shadow:0 2px 6px rgba(0,0,0,.1)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .theme button.on{background-color:#636366;box-shadow:none}}
:root[data-theme=dark] .theme button.on{background-color:#636366;box-shadow:none}
.theme button:not(.on):hover{color:var(--label)}

/* ─────────────────── 群組複選 chips ─────────────────── */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{
  display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:999px;
  font-size:.8125rem;font-weight:500;color:var(--label-2);
  background-color:var(--surface-2);border:.5px solid transparent;cursor:pointer;
  transition:background-color .16s,color .16s;user-select:none;min-height:34px;
}
@media (prefers-color-scheme:light){:root:not([data-theme=dark]) .chip{background-color:rgba(118,118,128,.1)}}
:root[data-theme=light] .chip{background-color:rgba(118,118,128,.1)}
.chip.on{background-color:var(--blue-tint);color:var(--blue);font-weight:590}
.chip.on::before{content:"✓";font-size:.75rem}
.chip:active{transform:scale(.97)}

/* ─────────────────── grouped list ─────────────────── */
.gtitle{
  font-size:.8125rem;font-weight:600;letter-spacing:.02em;color:var(--label-2);
  margin:0 4px 7px;display:flex;align-items:baseline;justify-content:space-between;gap:10px;
}
.gtitle .aside{font-weight:400;letter-spacing:0;font-size:.75rem;color:var(--label-3)}
.group{background-color:var(--surface);border-radius:var(--r-lg);overflow:hidden;margin-bottom:24px}
.group.flush{margin-bottom:12px}
.row{
  display:flex;align-items:center;gap:12px;min-height:44px;
  padding:11px 16px;position:relative;
}
.row+.row::before{
  content:"";position:absolute;top:0;left:16px;right:0;height:.5px;background-color:var(--separator);
}
.row-main{flex:1;min-width:0}
.row-t{font-size:1rem;line-height:1.3;overflow:hidden;text-overflow:ellipsis}
.row-s{font-size:.8125rem;color:var(--label-2);margin-top:2px;line-height:1.35}
.row-v{font-size:1rem;color:var(--label-2);text-align:right;white-space:nowrap}
.row-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.empty{padding:26px 16px;text-align:center;color:var(--label-2);font-size:.9375rem}

/* stat cluster inside a row (今日統計) */
.stats{display:flex;gap:18px;white-space:nowrap}
.stat{text-align:right}
.stat b{display:block;font-size:1.0625rem;font-weight:640;font-variant-numeric:tabular-nums;line-height:1.2}
.stat span{font-size:.6875rem;color:var(--label-3);letter-spacing:.01em}
.stat.zero b{color:var(--label-3);font-weight:500}

/* ─────────────────── buttons ─────────────────── */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:8px 15px;border-radius:var(--r-md);font-size:.875rem;font-weight:590;
  transition:transform .12s var(--ease),background-color .18s,opacity .18s;white-space:nowrap;
}
.btn:active{transform:scale(.965)}
.btn.filled{background-color:var(--blue-fill);color:#fff}
.btn.filled:hover{filter:brightness(1.12)}
.btn.tinted{background-color:var(--blue-tint);color:var(--blue)}
.btn.tinted:hover{background-color:color-mix(in srgb,var(--blue) 17%,transparent)}
.btn.plain{color:var(--blue);padding-inline:8px}
.btn.plain:hover{background-color:var(--surface-hover)}
.btn.danger{background-color:var(--red-tint);color:var(--red)}
.btn.danger:hover{background-color:color-mix(in srgb,var(--red) 18%,transparent)}
.btn.lg{padding:13px 20px;font-size:1rem;border-radius:12px;width:100%}
.btn[disabled]{opacity:.4;pointer-events:none}

/* ─────────────────── form controls ─────────────────── */
.field{
  background-color:var(--surface-2);border:.5px solid transparent;border-radius:var(--r-md);
  padding:8px 12px;font-size:.9375rem;min-width:0;width:100%;
  transition:border-color .18s,background-color .18s;
}
@media (prefers-color-scheme:light){:root:not([data-theme=dark]) .field{background-color:rgba(118,118,128,.09)}}
:root[data-theme=light] .field{background-color:rgba(118,118,128,.09)}
.field:focus{outline:none;border-color:var(--blue);background-color:var(--surface)}
.field::placeholder{color:var(--label-3)}
input[type=date].field{min-width:145px}

/* ─────────────────── status ─────────────────── */
.dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}
.st{display:inline-flex;align-items:center;gap:6px;font-size:.875rem;font-weight:500;white-space:nowrap}
.st-SEARCHING{color:var(--blue)} .st-ASSIGNED{color:var(--green)} .st-ARRIVED{color:var(--teal)}
.st-COMPLETED{color:var(--label-2)} .st-CANCELLED{color:var(--label-2)}
.st-NO_CAR{color:var(--orange)} .st-SEND_FAILED{color:var(--red)}
.plate{font-weight:640;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.tag{
  display:inline-block;padding:2px 8px;border-radius:6px;font-size:.75rem;font-weight:500;
  background-color:var(--surface-2);color:var(--label-2);
}
@media (prefers-color-scheme:light){:root:not([data-theme=dark]) .tag{background-color:rgba(118,118,128,.12)}}
:root[data-theme=light] .tag{background-color:rgba(118,118,128,.12)}

/* ─────────────────── responsive table ─────────────────── */
.tbl{width:100%;border-collapse:collapse;font-size:.9375rem}
.tbl th{
  text-align:left;font-size:.75rem;font-weight:590;color:var(--label-2);letter-spacing:.01em;
  padding:9px 16px;white-space:nowrap;
}
.tbl thead tr{border-bottom:.5px solid var(--separator)}
.tbl td{padding:11px 16px;vertical-align:middle}
.tbl tbody tr+tr td{border-top:.5px solid var(--separator)}
.tbl .r{text-align:right}
@media (max-width:767px){
  .tbl thead{display:none}
  .tbl,.tbl tbody,.tbl tr,.tbl td{display:block;width:100%}
  .tbl tbody tr{padding:12px 16px;position:relative}
  .tbl tbody tr+tr{border-top:.5px solid var(--separator)}
  .tbl td{padding:0;border:0!important;display:flex;justify-content:space-between;gap:14px;min-height:26px;align-items:baseline}
  .tbl td+td{margin-top:3px}
  .tbl td::before{
    content:attr(data-l);flex:none;font-size:.8125rem;color:var(--label-2);
  }
  .tbl td.lead{display:block;margin-bottom:5px}
  .tbl td.lead::before{display:none}
  .tbl td.r{text-align:left}
}

/* ─────────────────── login ─────────────────── */
.login{min-height:100vh;display:grid;place-items:center;padding:24px}
.login-card{width:100%;max-width:370px;text-align:center}
.login-icon{width:74px;height:74px;border-radius:17px;margin:0 auto 20px;display:block;box-shadow:var(--shadow)}
.login h1{font-size:1.4375rem;font-weight:640;letter-spacing:-.024em}
.login p{color:var(--label-2);font-size:.9375rem;margin-top:5px;margin-bottom:26px}
.login .field{text-align:center;font-size:1.25rem;font-weight:600;letter-spacing:.14em;padding:15px 14px;border-radius:12px}
.login .field::placeholder{letter-spacing:0;font-weight:400;font-size:1rem}
.err{color:var(--red);font-size:.875rem;min-height:1.3em;margin:10px 0 2px}

/* ─────────────────── sheet ─────────────────── */
.scrim{
  position:fixed;inset:0;z-index:var(--z-sheet);background:rgba(0,0,0,.42);
  display:flex;align-items:center;justify-content:center;padding:20px;
  animation:fade .22s var(--ease);
}
.sheet{
  background-color:var(--surface);border-radius:var(--r-lg);padding:26px 24px 20px;
  width:100%;max-width:350px;text-align:center;box-shadow:var(--shadow);
  animation:pop .26s var(--ease);
}
.sheet h2{font-size:1.0625rem;font-weight:640}
.sheet .code{
  font-size:2rem;font-weight:700;letter-spacing:.16em;color:var(--blue);
  font-variant-numeric:tabular-nums;margin:16px 0 10px;word-break:break-all;
  font-family:ui-monospace,"SF Mono",Menlo,monospace;
}
.sheet .note{font-size:.8125rem;color:var(--label-2);line-height:1.5;margin-bottom:20px}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:scale(.94)}}
@keyframes rise{from{opacity:0;transform:translateY(5px)}}
.view{animation:rise .24s var(--ease)}

/* ─────────────────── admin extras ─────────────────── */
.fleet-h{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:0 4px 7px}
.fleet-h h2{font-size:1.0625rem;font-weight:640;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.fleet-h .id{font-size:.75rem;font-weight:400;color:var(--label-3);letter-spacing:0}
details.add>summary{
  list-style:none;cursor:pointer;padding:11px 16px;min-height:44px;display:flex;align-items:center;
  gap:7px;color:var(--blue);font-size:.9375rem;font-weight:500;
}
details.add>summary::-webkit-details-marker{display:none}
details.add>summary:hover{background-color:var(--surface-hover)}
details.add[open]>summary{border-bottom:.5px solid var(--separator)}
.form-grid{display:grid;gap:10px;padding:14px 16px}
@media (min-width:768px){.form-grid{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));align-items:center}}
.form-grid .full{grid-column:1/-1}

@media (max-width:520px){
  .nav-in{padding:10px 16px}
  main{padding:16px 16px 40px}
  .row{padding:11px 14px}
  .row+.row::before{left:14px}
  .tbl tbody tr{padding:12px 14px}
  .stats{gap:14px}
  .btn{min-height:44px;padding-inline:16px}   /* 手機:符合 44pt 觸控目標 */
  .btn.plain{padding-inline:12px}
  .row-actions{gap:6px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
  .seg-ind{transition:none}
}
</style>
</head>
<body>
<div id="app"></div>

<svg style="display:none">
  <symbol id="i-logo" viewBox="0 0 100 100">
    <rect width="100" height="100" rx="22" fill="#007AFF"/>
    <g fill="#fff"><rect x="30" y="34" width="40" height="20" rx="8"/><rect x="19" y="45" width="62" height="19" rx="7"/></g>
    <rect x="37" y="39" width="11" height="9" rx="3" fill="#0A5BD0"/><rect x="52" y="39" width="11" height="9" rx="3" fill="#0A5BD0"/>
    <circle cx="34" cy="65" r="7" fill="#0A2A5E"/><circle cx="66" cy="65" r="7" fill="#0A2A5E"/>
  </symbol>
  <!-- 分頁圖示:SF Symbols 風格線性圖,stroke=currentColor -->
  <symbol id="i-live" viewBox="0 0 20 20"><path d="M1.6 10h3.2l2.1-5.4 3.3 10.8 2-5.4h6.2"/></symbol>

  <symbol id="i-settings" viewBox="0 0 20 20"><circle cx="10" cy="10" r="2.6"/><path d="M10 2.2v2.1M10 15.7v2.1M15.5 4.5l-1.5 1.5M6 14l-1.5 1.5M17.8 10h-2.1M4.3 10H2.2M15.5 15.5 14 14M6 6 4.5 4.5"/></symbol>
  <!-- 主題切換 -->
  <symbol id="i-sun" viewBox="0 0 20 20"><circle cx="10" cy="10" r="3.4"/><path d="M10 1.8v1.9M10 16.3v1.9M16 4l-1.4 1.4M5.4 14.6 4 16M18.2 10h-1.9M3.7 10H1.8M16 16l-1.4-1.4M5.4 5.4 4 4"/></symbol>

</svg>

<script>
const FN = 'https://znkphstzbguuijlcdhhy.supabase.co/functions/v1';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ST = {SEARCHING:'尋車中',ASSIGNED:'已派車',ARRIVED:'已到店',COMPLETED:'完成',CANCELLED:'取消',NO_CAR:'無車',SEND_FAILED:'發送失敗'};
const TY = {TAXI:'叫車',DESIGNATED_DRIVER:'代駕'};
const twTime = s => s ? new Date(s).toLocaleString('zh-TW',{timeZone:'Asia/Taipei',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit',hour12:false}) : '';
const twClock = s => s ? new Date(s).toLocaleString('zh-TW',{timeZone:'Asia/Taipei',hour:'2-digit',minute:'2-digit',hour12:false}) : '';
const LOGO = '<svg><use href="#i-logo"/></svg>';

let state = JSON.parse(localStorage.getItem('ts.console') || '{}');
let timer = null;

async function api(fn, body){
  const r = await fetch(FN + '/' + fn, {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const j = await r.json().catch(()=>({}));
  if (r.status === 401) { logout(); throw new Error('登入逾期'); }
  if (!r.ok) throw new Error(j.error || r.status);
  return j;
}
const save = () => localStorage.setItem('ts.console', JSON.stringify(state));
function logout(){ state = {}; save(); clearInterval(timer); renderLogin(); }

function showKey(title, key, note){
  const m = document.createElement('div');
  m.className = 'scrim';
  m.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}">
    <h2>${esc(title)}</h2><div class="code">${esc(key)}</div>
    <p class="note">${esc(note)}</p>
    <button class="btn filled lg">好，已記下</button></div>`;
  const close = () => m.remove();
  m.querySelector('button').onclick = close;
  m.onclick = e => { if (e.target === m) close(); };
  document.addEventListener('keydown', function esc2(e){ if(e.key==='Escape'){close();document.removeEventListener('keydown',esc2);} });
  document.body.appendChild(m);
  m.querySelector('button').focus();
}

function renderLogin(){
  clearInterval(timer);
  $('#app').innerHTML = `<div class="login"><div class="login-card">
    <svg class="login-icon" viewBox="0 0 100 100"><use href="#i-logo"/></svg>
    <h1>TripStore 後台</h1>
    <p>輸入金鑰以繼續</p>
    <input id="key" class="field" placeholder="金鑰" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="金鑰">
    <p class="err" id="err" role="alert"></p>
    <button class="btn filled lg" id="go">登入</button>
    <div style="display:flex;justify-content:center;margin-top:22px">${themeHTML()}</div>
  </div></div>`;
  bindTheme();
  $('#key').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
  $('#go').onclick = doLogin;
  $('#key').focus();
}
async function doLogin(){
  const key = $('#key').value.trim();
  if (!key) return;
  const btn = $('#go');
  btn.disabled = true; btn.textContent = '驗證中…'; $('#err').textContent = '';
  try {
    const r = await fetch(FN + '/platform-admin', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'list',key})});
    if (r.ok) { state = {mode:'admin', key}; save(); renderAdmin(); return; }
  } catch {}
  try {
    const j = await api('fleet-console', {action:'login', key});
    state = {mode:'fleet', token:j.token, fleet:j.fleet}; save(); renderFleet(); return;
  } catch {}
  btn.disabled = false; btn.textContent = '登入';
  $('#err').textContent = '金鑰不正確';
  $('#key').select();
}

/* ─── 主題:淺 / 深 / 跟隨系統(預設)。存 localStorage,套在 <html data-theme> ─── */
const THEMES = [['light','淺色','i-sun'],['dark','深色','i-moon'],['auto','跟隨系統','i-auto']];
function currentTheme(){ return localStorage.getItem('ts.theme') || 'auto'; }
function applyTheme(t){
  const root = document.documentElement;
  if (t === 'auto') root.removeAttribute('data-theme'); else root.setAttribute('data-theme', t);
  localStorage.setItem('ts.theme', t);
  // 手機瀏覽器上緣色塊跟著換
  const dark = t === 'dark' || (t === 'auto' && matchMedia('(prefers-color-scheme:dark)').matches);
  document.querySelectorAll('meta[name=theme-color]').forEach(m => m.remove());
  const m = document.createElement('meta');
  m.name = 'theme-color'; m.content = dark ? '#000000' : '#F2F2F7';
  document.head.appendChild(m);
}
function themeHTML(){
  const cur = currentTheme();
  return `<div class="theme" role="group" aria-label="外觀">
    ${THEMES.map(([k,label,icon])=>`<button data-theme-set="${k}" class="${cur===k?'on':''}"
      title="${label}" aria-label="${label}" aria-pressed="${cur===k}"><svg aria-hidden="true"><use href="#${icon}"/></svg></button>`).join('')}
  </div>`;
}
function bindTheme(){
  document.querySelectorAll('[data-theme-set]').forEach(b => b.onclick = () => {
    applyTheme(b.dataset.themeSet);
    document.querySelectorAll('[data-theme-set]').forEach(x => {
      const on = x.dataset.themeSet === b.dataset.themeSet;
      x.classList.toggle('on', on); x.setAttribute('aria-pressed', on);
    });
    moveInd();
  });
}
applyTheme(currentTheme());
function moveInd(){
  const seg = $('.seg'); if (!seg) return;
  const on = seg.querySelector('button.on'), ind = seg.querySelector('.seg-ind');
  if (!on || !ind || !on.offsetWidth) return;
  ind.style.width = on.offsetWidth + 'px';
  ind.style.transform = `translateX(${on.offsetLeft - 2}px)`;
}
/** 量測時機不只一個:首次繪製、字型載入完(中文字型會改變寬度)、容器尺寸變動 */
let segRO = null;
function trackInd(){
  moveInd();
  requestAnimationFrame(moveInd);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(moveInd);
  segRO?.disconnect();
  const seg = $('.seg');
  if (seg && window.ResizeObserver){ segRO = new ResizeObserver(moveInd); segRO.observe(seg); }
}
addEventListener('resize', moveInd);

        <div class="row-main"><div class="row-t">${esc(s.name)}</div>
          <div class="row-s">營業日 ${esc(s.businessDay)}</div></div>
        <div class="stats">
          ${statHTML(s.taxi,'叫車')}${statHTML(s.dd,'代駕')}${statHTML(s.cancelled,'取消')}${statHTML(s.noCar,'無車')}
        </div></div>`).join('');

    const html = `<div class="view">
      <div class="gtitle">進行中<span class="aside">${act.length ? act.length + ' 筆 · 每 10 秒更新' : '每 10 秒更新'}</span></div>
      <div class="group">${act.length ? `<table class="tbl"><thead><tr>
          <th>車輛</th><th>店家</th><th>狀態</th><th>類型</th><th class="r">ETA</th><th class="r">建立</th>
        </tr></thead><tbody>${actRows}</tbody></table>` : '<p class="empty">目前沒有進行中的任務</p>'}</div>

let rows = [], merchants = [];
async function loadReport(){
  $('#rBody').innerHTML = '<div class="group"><p class="empty">查詢中…</p></div>';
  try{
    const j = await api('fleet-console', {action:'report', token:state.token, from:$('#rFrom').value, to:$('#rTo').value});
    rows = j.rows||[]; merchants = j.merchants||[];
    const mName = id => (merchants.find(m=>m.id===id)||{}).name || id;
    const st = {};
    for (const t of rows){
      const s = st[t.merchant_id] ??= {name:mName(t.merchant_id), taxi:0, dd:0, cancelled:0, noCar:0, total:0};
      s.total++;
      if (t.status==='CANCELLED') s.cancelled++;
      else if (t.status==='NO_CAR') s.noCar++;
      else if (t.type==='TAXI') s.taxi++; else s.dd++;

    const sum = Object.values(st).map(s=>`<div class="row">
        <div class="row-main"><div class="row-t">${esc(s.name)}</div>
        <div class="row-s">合計 ${s.total} 筆</div></div>
        <div class="stats">${statHTML(s.taxi,'叫車')}${statHTML(s.dd,'代駕')}${statHTML(s.cancelled,'取消')}${statHTML(s.noCar,'無車')}</div>
      </div>`).join('');
    const list = rows.map(t=>`<tr>
        <td class="lead"><span class="plate">${esc(t.plate_number||'—')}</span>

        <td data-l="營業日" class="num">${esc(t.business_day)}</td>
        <td data-l="類型">${TY[t.type]||t.type}</td>
        <td data-l="狀態"><span class="st st-${t.status}">${ST[t.status]||t.status}</span></td>
        <td data-l="顏色">${esc(t.vehicle_color||'—')}</td>
        <td data-l="ETA" class="r num">${t.eta_minutes ?? '—'}</td>
        <td data-l="建立" class="r num" style="color:var(--label-2)">${twTime(t.created_at)}</td>
      </tr>`).join('');
    $('#rBody').innerHTML = `
      <div class="gtitle">每店統計</div>
      <div class="group">${sum || '<p class="empty">此區間沒有資料</p>'}</div>
      <div class="gtitle">逐筆<span class="aside">${rows.length} 筆</span></div>

        <th>車輛 / 店家</th><th>單號</th><th>營業日</th><th>類型</th><th>狀態</th><th>顏色</th><th class="r">ETA</th><th class="r">建立</th>
      </tr></thead><tbody>${list}</tbody></table>` : '<p class="empty">此區間沒有資料</p>'}</div>`;
  }catch(e){ if(e.message!=='登入逾期') $('#rBody').innerHTML = `<div class="group"><p class="empty">查詢失敗:${esc(e.message)}</p></div>`; }
}
function csv(){
  if (!rows.length) return;
  const mName = id => (merchants.find(m=>m.id===id)||{}).name || id;
  const head = '單號,營業日,店家,類型,狀態,車牌,顏色,分鐘,建立時間\n';
  const body = rows.map(t=>[t.id,t.business_day,mName(t.merchant_id),TY[t.type]||t.type,ST[t.status]||t.status,
    t.plate_number||'',t.vehicle_color||'',t.eta_minutes??'',twTime(t.created_at)]
    .map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['﻿'+head+body], {type:'text/csv'}));
  a.download = `tripstore-${$('#rFrom').value}~${$('#rTo').value}.csv`;
  a.click();
}

        arrived: split($('#alArrived').value), complete: split($('#alComplete').value), no_car: split($('#alNoCar').value) }});
      btn.textContent = '已儲存'; setTimeout(()=>{ btn.disabled=false; btn.textContent='儲存'; }, 900);
    }catch(e){ btn.disabled=false; btn.textContent='儲存'; alert('儲存失敗:'+e.message); }
  };
    document.querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>saveMerchant(b.dataset.save,b));
    document.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=()=>toggleMerchant(b.dataset.toggle,b.dataset.to==='true'));
  }catch(e){ fail(e); }
}
async function saveRecipient(){
  const btn = $('#rSave');
  btn.disabled = true; btn.textContent = '儲存中…';
  try{
    await api('fleet-console', {action:'set_recipient', token:state.token, recipientId:$('#rid').value.trim()});
    btn.textContent = '已儲存'; setTimeout(loadSettings, 700);
  }catch(e){
    btn.disabled = false; btn.textContent = '儲存';
    $('#rStatus').textContent = e.message === 'BAD_FORMAT' ? '格式不對。ID 是 C 或 U 開頭的 33 碼,請直接複製 bot 回覆的那一串。'
      : e.message === 'ALREADY_BOUND' ? '這個接收人已經綁給別的車隊了。'
      : '儲存失敗:' + e.message;
    $('#rStatus').style.color = 'var(--red)';
  }
}
async function saveMerchant(id, btn){
  const t = btn.textContent; btn.disabled = true; btn.textContent = '儲存中…';
  try{
    await api('fleet-console', {action:'update_merchant', token:state.token, merchantId:id, fields:{
      name:$('#mn-'+id).value, pickup_address:$('#ma-'+id).value,
      support_phone:$('#mp-'+id).value, settlement_time:$('#ms-'+id).value }});
    btn.textContent = '已儲存'; setTimeout(loadSettings, 700);
  }catch(e){ btn.disabled=false; btn.textContent=t; alert('儲存失敗:'+e.message); }
}
async function toggleMerchant(id, enabled){
  if (!enabled && !confirm('停用這家店?該店平板會立刻無法叫車。')) return;
  try{ await api('fleet-console', {action:'update_merchant', token:state.token, merchantId:id, fields:{enabled}}); loadSettings(); }
  catch(e){ alert('失敗:'+e.message); }
}
function fail(e){ if(e.message!=='登入逾期') $('#view').innerHTML = `<div class="group"><p class="empty">載入失敗:${esc(e.message)}</p></div>`; }

/* ═══════════════════ 平台管理 ═══════════════════ */
function renderAdmin(){
  clearInterval(timer);
  $('#app').innerHTML = shell('平台管理', 'TripStore', '<div id="view"><div class="group"><p class="empty">載入中…</p></div></div>');
  $('#out').onclick = logout; bindTheme();
  loadAdmin();
}
const adminApi = body => api('platform-admin', {...body, key:state.key});

async function loadAdmin(){
  try{
    const [{fleets, groups, merchants, devices}, quota] = await Promise.all([
      adminApi({action:'list'}),
      adminApi({action:'line_quota'}).catch(()=>null),
    ]);
    const html = fleets.map(f=>{
      const ms = merchants.filter(m=>m.fleet_id===f.id);
      const mRows = ms.map(m=>{
        const dev = devices.find(d=>d.merchant_id===m.id && d.enabled);
        const beat = dev && (dev.last_heartbeat_at || dev.last_seen_at);
        const on = beat && (Date.now()-new Date(beat).getTime())/60000 < 15;
        const devLine = dev
          ? `<span class="st" style="color:${on?'var(--green)':'var(--red)'}"><span class="dot" style="background:${on?'var(--dot-green)':'var(--dot-red)'}"></span>${on?'在線':'離線'}</span>`
            + (dev.battery_pct!=null?` · ${dev.battery_pct}%`:'') + (dev.app_version?` · v${esc(dev.app_version)}`:'')
            + (dev.hasPin?'':' · <span style="color:var(--orange)">未設 PIN</span>')
          : '<span style="color:var(--label-3)">尚未發金鑰</span>';
        return `<div class="row" style="flex-wrap:wrap;gap:10px">
          <div class="row-main" style="min-width:190px">
            <div class="row-t">${esc(m.name)} <span class="id">${esc(m.id)}</span>
              ${m.enabled?'':'<span class="tag">已停用</span>'}</div>
            <div class="row-s">${esc(m.pickup_address)}</div>
            <div class="row-s" style="margin-top:4px">${devLine}</div></div>
          <div class="row-actions">
            <button class="btn tinted" data-dk="${m.id}" data-n="${esc(m.name)}">${dev?'重發金鑰':'發金鑰'}</button>
            <button class="btn plain" data-pin="${m.id}" data-n="${esc(m.name)}">${dev&&dev.hasPin?'重發 PIN':'發 PIN'}</button>
            <button class="btn ${m.enabled?'danger':'plain'}" data-mt="${m.id}" data-to="${!m.enabled}">${m.enabled?'停用':'啟用'}</button>
            ${m.enabled?'':`<button class="btn danger" data-mdel="${m.id}" data-n="${esc(m.name)}">刪除</button>`}
          </div></div>`;}).join('');
      return `<div class="fleet-h">
          <h2>${esc(f.name)} <span class="id">${esc(f.id)}</span>${f.enabled?'':'<span class="tag">已停用</span>'}</h2>
          <div class="row-actions">
            <button class="btn tinted" data-fk="${f.id}" data-n="${esc(f.name)}">${f.hasConsoleKey?'重發':'發'}車隊後台密碼</button>
            <button class="btn ${f.enabled?'danger':'plain'}" data-ft="${f.id}" data-to="${!f.enabled}">${f.enabled?'停用':'啟用'}</button>
            ${f.enabled?'':`<button class="btn danger" data-fdel="${f.id}" data-n="${esc(f.name)}">刪除</button>`}
          </div></div>
        <div class="group">
          <div class="row">
            <div class="row-main"><div class="row-t">LINE 車板群組</div>
              <div class="row-s">由車隊後台自行設定</div></div>
            <div class="row-v">${(groups||[]).filter(g=>g.fleet_id===f.id).map(g=>g.line_group_id[0]==='U'?'個人':'群組').join('、') || '尚未設定'}</div>
          </div>
          <div class="row"><div class="row-main"><div class="row-t">客服電話</div></div>
            <div class="row-v">${esc(f.support_phone||'—')}</div></div>
          ${mRows}
          <details class="add"><summary>＋ 新增店家</summary>
            <div class="form-grid">
              <input class="field" id="nm-id-${f.id}" placeholder="代號 如 bar_001">
              <input class="field" id="nm-name-${f.id}" placeholder="店名">
              <input class="field" id="nm-st-${f.id}" value="05:00" placeholder="結算 05:00">
              <input class="field full" id="nm-addr-${f.id}" placeholder="上車地址">
              <div class="full"><button class="btn filled" data-nm="${f.id}">建立店家</button></div>
            </div></details>
        </div>`;}).join('');

        const pct = quota && quota.limit ? Math.round(quota.used / quota.limit * 100) : null;
    const quotaHtml = quota && quota.limit != null ? `
      <div class="gtitle">LINE 訊息額度<span class="aside">按日本時間切月・用完 push 會直接停發</span></div>
      <div class="group"><div class="row">
        <div class="row-main">
          <div class="row-t num">${quota.used.toLocaleString()} / ${quota.limit.toLocaleString()} 則
            ${pct >= 80 ? '<span style="color:var(--red);font-weight:640"> ・已達 ' + pct + '%,考慮升級方案</span>'
              : '<span class="row-s" style="display:inline"> (' + pct + '%)</span>'}</div>
          <div style="height:6px;border-radius:3px;background-color:var(--surface-2);margin-top:8px;overflow:hidden">
            <div style="height:100%;width:${Math.min(100, pct)}%;border-radius:3px;background-color:${pct >= 80 ? 'var(--red)' : 'var(--blue-fill)'}"></div>
          </div>
        </div></div></div>` : '';
    $('#view').innerHTML = quotaHtml + (`<div class="view">${html || ''}
      <div class="gtitle">新增</div>
      <div class="group"><details class="add"><summary>＋ 新增車隊</summary>
        <div class="form-grid">
          <input class="field" id="nf-id" placeholder="代號 如 fleet_01">
          <input class="field" id="nf-name" placeholder="車隊名稱">
          <input class="field" id="nf-phone" placeholder="客服電話">
          <div class="full"><button class="btn filled" id="nf-go">建立車隊</button>
            <p class="row-s" style="margin-top:10px">建好後按「發車隊後台密碼」給車隊,車隊登入後台即可自行綁定 LINE 群組。</p></div>
        </div></details></div></div>`);
    bindAdmin();
  }catch(e){ if(e.message!=='登入逾期') $('#view').innerHTML = `<div class="group"><p class="empty">載入失敗:${esc(e.message)}</p></div>`; }
}
function bindAdmin(){
  const q = (sel, fn) => document.querySelectorAll(sel).forEach(b => b.onclick = () => fn(b));
  q('[data-fk]', b => issueFleetKey(b.dataset.fk, b.dataset.n));
  q('[data-dk]', b => issueDeviceKey(b.dataset.dk, b.dataset.n));
  q('[data-pin]', b => issuePin(b.dataset.pin, b.dataset.n));
  q('[data-ft]', b => toggleFleet(b.dataset.ft, b.dataset.to==='true'));
  q('[data-mt]', b => adminToggleMerchant(b.dataset.mt, b.dataset.to==='true'));
  q('[data-mdel]', b => deleteMerchant(b.dataset.mdel, b.dataset.n));
  q('[data-fdel]', b => deleteFleet(b.dataset.fdel, b.dataset.n));
  q('[data-nm]', b => createMerchant(b.dataset.nm));
  const nf = $('#nf-go'); if (nf) nf.onclick = createFleet;
}
async function issueFleetKey(id, name){
  if (!confirm(`發新的車隊金鑰給「${name}」?\n\n舊金鑰立刻失效,已登入的網頁會被登出。`)) return;
  const j = await adminApi({action:'issue_fleet_key', fleetId:id});
  showKey(name + ' 車隊後台密碼', j.key, '給車隊登入這個網頁用。只顯示這一次,關掉就看不到了。');
  loadAdmin();
}
async function issueDeviceKey(id, name){
  if (!confirm(`發新的裝置金鑰給「${name}」?\n\n若已有平板綁定,舊金鑰立刻失效,該店平板需要重新綁定。`)) return;
  const j = await adminApi({action:'issue_device_key', merchantId:id});
  showKey(name + ' 裝置金鑰', j.key, '輸入到平板的綁定畫面。只顯示這一次,關掉就看不到了。');
  loadAdmin();
}
async function issuePin(id, name){
  try{
    const j = await adminApi({action:'issue_pin', merchantId:id});
    showKey(name + ' 隱藏設定 PIN', j.pin, '長按平板左上角店名 5 秒後輸入。只顯示這一次。');
  }catch(e){ alert(e.message==='NO_DEVICE' ? '這家店還沒有裝置,請先發裝置金鑰。' : '失敗:'+e.message); }
  loadAdmin();
}
async function deleteMerchant(id, name){
  if (!confirm(`永久刪除店家「${name}」?

該店的所有歷史叫車紀錄、裝置綁定會一併刪除,無法復原。`)) return;
  if (prompt(`確認刪除請輸入店家名稱:${name}`) !== name) return;
  try{ await adminApi({action:'delete_merchant', merchantId:id}); }catch(e){ alert('刪除失敗:'+e.message); }
  loadAdmin();
}
async function deleteFleet(id, name){
  if (!confirm(`永久刪除車隊「${name}」?

其下所有店家、歷史紀錄、裝置與後台登入會一併刪除,無法復原。`)) return;
  if (prompt(`確認刪除請輸入車隊名稱:${name}`) !== name) return;
  try{ await adminApi({action:'delete_fleet', fleetId:id}); }catch(e){ alert('刪除失敗:'+e.message); }
  loadAdmin();
}
async function toggleFleet(id, enabled){
  if (!enabled && !confirm('停用整個車隊?\n\n其下所有平板與網頁登入都會失效。')) return;
  await adminApi({action:'update_fleet', fleetId:id, fields:{enabled}}); loadAdmin();
}
async function adminToggleMerchant(id, enabled){
  if (!enabled && !confirm('停用這家店?該店平板會立刻無法叫車。')) return;
  await adminApi({action:'update_merchant', merchantId:id, fields:{enabled}}); loadAdmin();
}
async function createFleet(){
  try{
    await adminApi({action:'create_fleet', fleetId:$('#nf-id').value, name:$('#nf-name').value, supportPhone:$('#nf-phone').value});
    loadAdmin();
  }catch(e){ alert(e.message==='DUPLICATE' ? '這個代號已經有人用了。' : '建立失敗:'+e.message); }
}
async function createMerchant(fleetId){
  try{
    await adminApi({action:'create_merchant', fleetId,
      merchantId:$('#nm-id-'+fleetId).value, name:$('#nm-name-'+fleetId).value,
      pickupAddress:$('#nm-addr-'+fleetId).value, settlementTime:$('#nm-st-'+fleetId).value});
    loadAdmin();
  }catch(e){ alert(e.message==='DUPLICATE' ? '這個代號已經有人用了。' : '建立失敗:'+e.message); }
}

/* ═══════════════════ 啟動 ═══════════════════ */
if (state.mode === 'admin' && state.key) renderAdmin();
else if (state.mode === 'fleet' && state.token) renderFleet();
else renderLogin();
</script>
</body>
</html>
